# DRAFT F-Droid metadata for PassPony (Android) -- per P16
# (docs/plan/P16-release.md item 3). Not yet submitted to fdroiddata;
# lives here so it's reviewable in this repo's own history before it
# becomes an MR against https://gitlab.com/fdroid/fdroiddata. Canonicalize
# with `fdroid rewritemeta`/`fdroid lint` (per NorseHorse's F-Droid
# Submission Playbook) before it's ever pasted into the GitLab web editor
# -- see docs/RELEASE_CHECKLIST.md for the manual steps only Kevin can do
# (the GitLab fork/MR itself needs his account).
#
# PassPonyCore (the Rust crypto core) and PGPonyCore-Kotlin (the
# pass/OpenPGP engine) are both git submodules of this repo
# (third_party/passponycore, third_party/pgponycore-kotlin). No srclibs:
# declaration is needed for either -- `submodules: true` below runs
# `git submodule update --init --recursive` automatically right after the
# clone, before prebuild runs (confirmed against F-Droid's own Build
# Metadata Reference). See docs/REPRODUCIBLE.md for why PassPonyCore
# specifically became a submodule in P16 rather than staying a separate,
# SHA-pinned clone: a real F-Droid recipe has no way to inject an env var
# into the build it clones, which that older architecture needed.
#
# prebuild: commands run from subdir: (app/), not the repo root -- also
# confirmed against the Build Metadata Reference, since an earlier draft
# of this file got that wrong (it referenced a $$PassPonyAndroid$$
# variable that isn't real; only $$SDK$$/$$NDK$$/$$VERSION$$/$$VERCODE$$/
# $$COMMIT$$ and declared srclib names are substituted). Paths below are
# relative to app/ accordingly.
#
# No Summary:/Description: fields below on purpose. fdroidserver's
# `fdroid update` reads fastlane/metadata/android/en-US/short_description.txt
# and full_description.txt straight from this repo (P16 item 2) and uses
# those for the store listing when the metadata file doesn't set its own
# -- confirmed by running `fdroid lint` against this file with both
# fields removed once the fastlane text existed: clean pass, since lint's
# only hard requirement is that a summary/description exist somewhere,
# not specifically inline here. One source of truth instead of two
# copies that can drift.
#
# The `commit:` below is a placeholder -- current main HEAD as of this
# draft, standing in until an actual vX.Y.Z release is tagged. Replace it
# with `git rev-list -n 1 <tag>` at submission time (never the tag name
# itself -- the playbook's rule; reviewers ask for the hash even when a
# tag would resolve), and update versionName/versionCode/CurrentVersion/
# CurrentVersionCode to match.
#
# Not opting into Reproducible Builds (Binaries:/AllowedAPKSigningKeys:)
# in this draft -- both need a real signed release APK's cert SHA-256,
# which doesn't exist until scripts/release.sh produces the first actual
# v1.0.0 release. docs/REPRODUCIBLE.md's determinism gate is already
# proven green (tools/verify_repro.sh rebuild main: IDENTICAL), so
# there's nothing else blocking opting in once that release exists --
# add the two fields then.

Categories:
  - Password & 2FA
License: Apache-2.0
AuthorName: NorseHorse
AuthorEmail: NorseHorse@norsehor.se
WebSite: https://passpony.app
SourceCode: https://github.com/norsehorse-dev/PassPonyAndroid
IssueTracker: https://github.com/norsehorse-dev/PassPonyAndroid/issues
Changelog: https://github.com/norsehorse-dev/PassPonyAndroid/releases

AutoName: PassPony

RepoType: git
Repo: https://github.com/norsehorse-dev/PassPonyAndroid.git

Builds:
  - versionName: "1.0.0"
    versionCode: 100
    commit: 14572f9a57822e00ca79ebd6f8f3443b4fcd01cf
    subdir: app
    submodules: true
    sudo:
      # F-Droid's build container starts bare -- rustup, perl, and make
      # (pass-core's vendored OpenSSL build for mobile targets, see
      # scripts/build-core.sh) all need to exist before prebuild can
      # cross-compile pass-ffi. The Android NDK itself comes from
      # $$NDK$$, F-Droid's own build environment, not installed here.
      - apt-get update
      - apt-get install -y perl make
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
    prebuild:
      # Mirrors scripts/build-core.sh's own steps (see that script for
      # the authoritative, commented version this must stay in sync
      # with): pin the toolchain PassPonyCore's own rust-toolchain.toml
      # names, add both Android targets, install cargo-ndk, then
      # cross-compile with the same RUSTFLAGS remap-path-prefix and
      # SOURCE_DATE_EPOCH/target-dir determinism pins P15/P16 set up
      # (see docs/REPRODUCIBLE.md). Paths are relative to subdir: (app/).
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export ANDROID_NDK_HOME="$$NDK$$"
      - cd ../third_party/passponycore && rustup show
      - cargo install cargo-ndk
      - cd .. && bash scripts/build-core.sh
    gradle:
      - foss
    output: app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk

AutoUpdateMode: None
UpdateCheckMode: Tags
CurrentVersion: "1.0.0"
CurrentVersionCode: 100

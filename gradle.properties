org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Pinned rather than left to whatever's newest installed locally: an
# uncontrolled input to the F-Droid reproducible build (see
# docs/plan/P15-ci-reproducible.md, docs/REPRODUCIBLE.md). This is the
# single source of truth AGP reads for the on-device .so's toolchain
# (via app/build.gradle.kts's ndkVersion = ...); scripts/build-core.sh
# reads this same value for its independent cargo-ndk cross-compile so
# the two never drift apart. Bump deliberately alongside an NDK upgrade.
ndkVersion=27.2.12479018

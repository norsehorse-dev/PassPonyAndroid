name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly reproducible-build verification (see the verify-reproducible
    # job below and docs/REPRODUCIBLE.md) -- Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

permissions:
  contents: read

jobs:
  build:
    name: Build, unit test, lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PassPonyAndroid
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Reject dynamic dependency versions
        run: |
          set -euo pipefail
          if grep -RnE "[0-9]\.\+[\"']" --include="*.kts" . \
             || grep -RniE "latest\.(release|integration)" --include="*.kts" .; then
            echo "::error::Dynamic dependency version found -- pin an exact version for reproducible builds (see docs/REPRODUCIBLE.md)."
            exit 1
          fi
          echo "No dynamic dependency versions found."

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        # Baseline only -- PassPonyCore's own rust-toolchain.toml pins the
        # actual channel once cargo runs from inside third_party/passponycore/
        # below.

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: third_party/passponycore -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Read pinned NDK version
        id: ndk
        run: echo "version=$(sed -n 's/^ndkVersion=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Install pinned NDK
        run: sdkmanager --install "ndk;${{ steps.ndk.outputs.version }}"

      - name: Cross-compile pass-ffi and generate Kotlin bindings
        # PassPonyCore comes in as the third_party/passponycore submodule
        # (see P16 -- previously a separate checkout pinned by a
        # PASSPONY_CORE_SHA env var here and in tools/verify_repro.sh; the
        # submodule pointer replaces that). scripts/build-core.sh's own
        # PASSPONY_CORE default now finds it there without an override.
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ steps.ndk.outputs.version }}
        run: bash scripts/build-core.sh

      - name: Gradle build, unit tests, lint
        run: ./gradlew test assembleFossDebug assemblePlayDebug lint --stacktrace

      - name: Upload generated core sources for the emulator job
        uses: actions/upload-artifact@v4
        with:
          name: core-generated
          path: |
            core/src/main/jniLibs
            core/src/main/kotlin/uniffi
          retention-days: 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: foss-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
          retention-days: 7

  emulator:
    name: Emulator fixture round-trip
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PassPonyAndroid
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download generated core sources
        uses: actions/download-artifact@v4
        with:
          name: core-generated
          path: core/src/main

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests (emulator fixture round-trip)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew connectedFossDebugAndroidTest

  verify-reproducible:
    name: Weekly reproducible-build verification
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PassPonyAndroid
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install perl and make
        run: sudo apt-get update && sudo apt-get install -y perl make

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Read pinned NDK version
        id: ndk
        run: echo "version=$(sed -n 's/^ndkVersion=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Install pinned NDK
        run: sdkmanager --install "ndk;${{ steps.ndk.outputs.version }}"

      - name: Run the determinism gate against main
        # tools/verify_repro.sh is the same tool the tag-triggered release
        # gate (.github/workflows/reproducible.yml) uses; this weekly run
        # is a drift check on main rather than a specific release, so it
        # points the gate at the "main" ref instead of a version tag --
        # `rebuild` accepts any git ref, tag or branch. PassPonyCore comes
        # in via each clone's own submodule init now (P16), not a separate
        # PASSPONY_CORE_SHA-pinned checkout.
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ steps.ndk.outputs.version }}
        run: bash tools/verify_repro.sh rebuild main
